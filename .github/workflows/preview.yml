name: preview

# Throwaway windows-latest verification loop for the community/win-launcher
# work: pushed only to preview/** branches on the fork, never landed on a PR
# branch. Mirrors the windows-process-lifecycle job of dynamic-workflow.yml.
on:
  push:
    branches: ['preview/**']

permissions:
  contents: read

jobs:
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/hetaoBackend/mcode-dynamic-workflows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b18 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: node --test checks/process-tree.check.mjs
      - run: node --test checks/win-launcher.check.mjs
