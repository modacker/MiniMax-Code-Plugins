# Preview mirror for community/win-launcher: prove the launcher suite passes
# on a REAL windows-latest runner before the workflow edit lands on the PR
# branch (hetaoBackend review blocker #2 on PR #52). Mirror-only; never part
# of the upstream PR diff.
name: preview
on:
  push:
    branches: ['preview/**']
  workflow_dispatch:
jobs:
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugins/hetaoBackend/mcode-dynamic-workflows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: node --test checks/process-tree.check.mjs
      - run: node --test checks/win-launcher.check.mjs
        shell: bash
