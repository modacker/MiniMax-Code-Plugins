# webui/.github/workflows/ci.yml
#
# mcode-webui v2 CI — lease C02.
#
# Three jobs:
#   1. lint-and-format:  Node 22 / Node 24 × macOS / Linux / Windows
#                        matrix (6 runs). Runs npm ci → npm run check
#                        (check-docs-alignment) → npm test. This is the
#                        §6 "可测试性" criterion + the §5 reproducibility
#                        spine via `npm ci` (lockfile-driven install).
#   2. smoke-test:       Only Node 22 × macOS. Boots `npm start` in the
#                        background, waits 5s, curls GET /api/health,
#                        then kills the server. Verifies the server
#                        process actually responds under HTTP — the
#                        `npm test` suite covers pure unit logic but
#                        cannot catch socket-level regressions.
#   3. sbom:             Only Node 22 × Linux. Runs `npm run sbom` and
#                        uploads `sbom.cdx.json` as a build artifact.
#                        Implements the §5 (reproducibility + SBOM)
#                        half of the lease. CVE gating is also folded
#                        in here via `npm audit` (parity with §5).
#
# Triggers:
#   - push to main / master
#   - pull_request targeting main / master
#   - workflow_dispatch (manual run)
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel superseded runs on the same PR / branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All jobs use the same minimal permissions — read-only contents.
permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Job 1 — full lint+check+test matrix across Node versions and OSes.
  # -----------------------------------------------------------------------
  lint-and-format:
    name: lint/check/test (Node ${{ matrix.node-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
            ${{ runner.os }}-node-

      - name: Install dependencies (lockfile-driven)
        run: npm ci --no-audit --no-fund

      - name: Run docs/manifest alignment check
        run: npm run check

      - name: Run unit test suite
        run: npm test

  # -----------------------------------------------------------------------
  # Job 2 — smoke test the running HTTP server.
  #
  # We deliberately scope this to a single (Node 22 / macOS) combination
  # to keep the matrix total bounded. The lint-and-format matrix above
  # already covers cross-version parsing of every script in the repo;
  # this job only needs to confirm that:
  #   - the server actually binds a socket
  #   - /api/health responds 200 within a 5s grace window
  # -----------------------------------------------------------------------
  smoke-test:
    name: smoke-test HTTP /api/health (Node 22 / macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (lockfile-driven)
        run: npm ci --no-audit --no-fund

      - name: Start webui in background
        env:
          # Pin a known port and turn off LAN sharing so the smoke test
          # stays local. Token is a dummy value — the smoke test only
          # hits /api/health which is auth-free.
          PORT: "31877"
          HOST: "127.0.0.1"
          TOKEN: "smoke-test-dummy-token"
        run: |
          nohup npm start > smoke.log 2>&1 &
          echo "$!" > smoke.pid
          # Give the server a brief boot window. We do not use a
          # `wait-on` dependency to keep the workflow zero-dep.
          sleep 5

      - name: Smoke-test GET /api/health
        run: |
          status=$(curl -s -o smoke.body -w "%{http_code}" \
            http://127.0.0.1:31877/api/health || echo "000")
          echo "HTTP status: $status"
          cat smoke.body || true
          if [ "$status" != "200" ]; then
            echo "::error::expected HTTP 200 from /api/health, got $status"
            cat smoke.log || true
            exit 1
          fi

      - name: Kill background server
        if: always()
        run: |
          if [ -f smoke.pid ]; then
            pid=$(cat smoke.pid)
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              # On Windows runners the bash kill of an npm-launched Node
              # process can be flaky; a follow-up job-level cleanup is
              # not strictly needed because the runner is ephemeral.
            fi
          fi

      - name: Upload smoke.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: smoke.log
          if-no-files-found: ignore

  # -----------------------------------------------------------------------
  # Job 3 — generate SBOM and upload as artifact. The CVE gating is
  # folded into the same job because `npm audit` shares the same
  # dependency tree the SBOM walks.
  # -----------------------------------------------------------------------
  sbom:
    name: sbom + cve-gate (Node 22 / Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (lockfile-driven)
        run: npm ci --no-audit --no-fund

      - name: CVE gate (npm audit, omit dev / low)
        # mcode-webui ships zero runtime deps (engines.locked deps are
        # dev only), so this gate normally returns clean. If a future
        # transitive devDep gains a CVE, the waiver list lives in
        # .cve-ignore.json — review that file before disabling this gate.
        run: |
          set +e
          out=$(npm audit --omit=dev --audit-level=low 2>&1)
          rc=$?
          set -e
          echo "$out" | tail -30
          if [ "$rc" -ne 0 ]; then
            echo "::error::npm audit reported unwaived vulnerabilities (exit $rc). Add the IDs to .cve-ignore.json with a 30-day waiver + reason."
            exit 1
          fi

      - name: Generate CycloneDX SBOM
        run: npm run sbom

      - name: Validate SBOM round-trip parse
        run: |
          node -e '
            const d = require("./sbom.cdx.json");
            if (d.bomFormat !== "CycloneDX") throw new Error("bomFormat !== CycloneDX");
            if (d.specVersion !== "1.5") throw new Error("specVersion !== 1.5");
            if (!Array.isArray(d.components)) throw new Error("missing components array");
            console.log("components:", d.components.length);
          '

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
